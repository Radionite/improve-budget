name: Deploy naar Firebase

# Zet de app live bij elke push naar main (of handmatig via "Run workflow").
# Werkt op het gratis Spark-abonnement: alleen Hosting en de Firestore-regels.
# Benodigd (Settings > Secrets and variables > Actions), zie README:
#   secrets: FIREBASE_SERVICE_ACCOUNT, FIREBASE_PROJECT_ID,
#            VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_APP_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Instellingen controleren
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          APPID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=""
          [ -n "$SA" ] || missing="$missing FIREBASE_SERVICE_ACCOUNT"
          [ -n "$PID" ] || missing="$missing FIREBASE_PROJECT_ID"
          [ -n "$KEY" ] || missing="$missing VITE_FIREBASE_API_KEY"
          [ -n "$DOMAIN" ] || missing="$missing VITE_FIREBASE_AUTH_DOMAIN"
          [ -n "$APPID" ] || missing="$missing VITE_FIREBASE_APP_ID"
          if [ -n "$missing" ]; then echo "::error::Deze secrets ontbreken:$missing"; exit 1; fi
          echo "$SA" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('type')=='service_account' and d.get('private_key')" \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT is geen geldige JSON-sleutel van een service-account"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Webapp testen en bouwen
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Inloggegevens klaarzetten
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only hosting,firestore:rules --non-interactive

      - name: Opruimen
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
