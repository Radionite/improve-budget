name: Deploy naar Firebase

# Zet de app live bij elke push naar main (of handmatig via "Run workflow").
# Werkt op het gratis Spark-abonnement: alleen Hosting en de Firestore-regels.
# Benodigd (Settings > Secrets and variables > Actions), zie README:
#   secrets: FIREBASE_SERVICE_ACCOUNT, FIREBASE_PROJECT_ID,
#            VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_APP_ID
#   variable: DEPLOY_ENABLED = true

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Webapp testen en bouwen
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Inloggegevens klaarzetten
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only hosting,firestore:rules --non-interactive

      - name: Opruimen
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
