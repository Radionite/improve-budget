name: Deploy naar Firebase

# Zet de app live bij elke push naar main (of handmatig via "Run workflow").
# Werkt op het gratis Spark-abonnement: alleen Hosting en de Firestore-regels.
# Benodigde secrets (Settings > Secrets and variables > Actions), zie README:
#   FIREBASE_SERVICE_ACCOUNT, VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_APP_ID
# De project-id wordt uit de service-account-sleutel gehaald.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Instellingen controleren
        id: cfg
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          APPID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=""
          [ -n "$SA" ] || missing="$missing FIREBASE_SERVICE_ACCOUNT"
          [ -n "$KEY" ] || missing="$missing VITE_FIREBASE_API_KEY"
          [ -n "$DOMAIN" ] || missing="$missing VITE_FIREBASE_AUTH_DOMAIN"
          [ -n "$APPID" ] || missing="$missing VITE_FIREBASE_APP_ID"
          if [ -n "$missing" ]; then echo "::error::Deze secrets ontbreken:$missing"; exit 1; fi
          PROJECT=$(printf '%s' "$SA" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('type')=='service_account' and d.get('private_key'); print(d['project_id'])") \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT is geen geldige JSON-sleutel van een service-account. Plak de volledige inhoud van het .json-bestand."; exit 1; }
          case "$KEY" in AIza*) ;; *) echo "::error::VITE_FIREBASE_API_KEY lijkt niet te kloppen (hij begint normaal met AIza)."; exit 1;; esac
          case "$DOMAIN" in *.firebaseapp.com|*.web.app) ;; *) echo "::error::VITE_FIREBASE_AUTH_DOMAIN moet eindigen op .firebaseapp.com"; exit 1;; esac
          case "$APPID" in 1:*:web:*) ;; *) echo "::error::VITE_FIREBASE_APP_ID moet beginnen met 1: en :web: bevatten"; exit 1;; esac
          echo "Project: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Webapp testen en bouwen
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ steps.cfg.outputs.project }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Inloggegevens klaarzetten
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          PROJECT: ${{ steps.cfg.outputs.project }}
        run: npx --yes firebase-tools@13 deploy --project "$PROJECT" --only hosting,firestore:rules --non-interactive

      - name: Foutmelding van Firebase tonen
        if: failure()
        run: |
          if [ -f firebase-debug.log ]; then
            grep -vi "private_key\|Bearer\|access_token" firebase-debug.log | tail -60
          fi

      - name: Opruimen
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
