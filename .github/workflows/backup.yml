name: Back-up

# Elke nacht een versleutelde back-up van de hele database (inclusief facturen en foto's).
# De back-up staat 90 dagen als 'artifact' bij de workflow-run (alleen zichtbaar voor jou).
# Benodigd: secrets FIREBASE_SERVICE_ACCOUNT en BACKUP_PASSWORD. Zonder die secrets wordt er niets gedaan.
# Terugzetten: zie README.

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instellingen controleren
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PW: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -n "$SA" ] && [ -n "$PW" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Geen back-up: FIREBASE_SERVICE_ACCOUNT en/of BACKUP_PASSWORD ontbreken."; fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - run: npm ci
        if: steps.check.outputs.ok == 'true'
        working-directory: scripts

      - name: Database exporteren
        if: steps.check.outputs.ok == 'true'
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node backup.mjs "$RUNNER_TEMP/backup.json"

      - name: Versleutelen
        if: steps.check.outputs.ok == 'true'
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          test -n "$BACKUP_PASSWORD" || { echo "BACKUP_PASSWORD ontbreekt"; exit 1; }
          gzip -9 "$RUNNER_TEMP/backup.json"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/backup.json.gz" \
            -out "$RUNNER_TEMP/gezinsbank-backup-$(date -u +%Y-%m-%d).json.gz.enc" \
            -pass env:BACKUP_PASSWORD
          rm -f "$RUNNER_TEMP/backup.json.gz"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: gezinsbank-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/gezinsbank-backup-*.json.gz.enc
          retention-days: 90
          if-no-files-found: error
